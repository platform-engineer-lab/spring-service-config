image:
  repository: ghcr.io/platform-engineer-lab/spring-service
  tag: 431bc59
  pullPolicy: IfNotPresent
service:
  port: 8080
replicaCount: 1
hostname: ""

# Cluster label for canary analysis queries (overridden per env).
cluster: ""
probe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  liveness: true
gateway:
  name: podinfo
  namespace: podinfo
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
rollout:
  canary:
    steps:
      - setWeight: 50
      - pause:
          duration: 30s
      - setWeight: 100
    analysis:
      enabled: false
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# OpenTelemetry auto-instrumentation (OTel Operator injects the Java agent).
podAnnotations:
  resource.opentelemetry.io/service.name: "spring-service"
  instrumentation.opentelemetry.io/inject-java: "business-apps/platform"
