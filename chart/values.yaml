image:
  repository: ghcr.io/platform-engineer-lab/spring-service
  tag: 431bc59
  pullPolicy: IfNotPresent
service:
  port: 8080
replicaCount: 1
hostname: ""
probe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  liveness: true
gateway:
  name: podinfo
  namespace: podinfo
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
rollout:
  canary:
    steps:
      - setWeight: 50
      - pause:
          duration: 30s
      - setWeight: 100
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
